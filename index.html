<!DOCTYPE html>
<html>
<head>
    <title>MP3 Player</title>
    <style>
        audio {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <audio controls autoplay loop>
        <source src="瞬.mp3" type="audio/mpeg">
        <source src="瞬.ogg" type="audio/ogg">
        <p>您的浏览器不支持音频播放，请<a href="瞬.mp3">下载</a>。</p>
    </audio>
</body>
</html>
